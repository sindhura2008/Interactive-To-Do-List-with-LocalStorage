<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>My tasks</h1>

    <form id="form" autocomplete="off">
      <input type="text" id="text" placeholder="What needs doing?" aria-label="New task">
      <button type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet. Add your first task above.</p>

    <footer>
      <p id="count">0 left</p>
      <button type="button" id="clear">Clear completed</button>
    </footer>
  </main>
</body>
</html>
